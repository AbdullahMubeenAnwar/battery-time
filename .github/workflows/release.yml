name: Release

# Triggers when you push a version tag: git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build DMG & publish release
    # Must be a runner whose default SDK is macOS 26+, otherwise the liquid
    # glass code (#if HAS_MACOS26_SDK) is compiled out of the shipped binary.
    runs-on: macos-26

    permissions:
      contents: write       # needed to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Verify macOS 26 SDK (guards liquid glass)
        run: |
          sdk_ver="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $sdk_ver"
          if [[ "${sdk_ver%%.*}" -lt 26 ]]; then
            echo "::error::SDK $sdk_ver < 26 — liquid glass would be stripped. Aborting release." >&2
            exit 1
          fi

      - name: Build app
        run: ./script/build_and_run.sh build
        env:
          BATTERYTIME_VERSION: ${{ steps.version.outputs.version }}

      - name: Build DMG
        run: ./script/build_dmg.sh
        env:
          BATTERYTIME_VERSION: ${{ steps.version.outputs.version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Battery Time ${{ github.ref_name }}"
          body: |
            ## Battery Time ${{ github.ref_name }}

            ### Install
            1. Download **BatteryTime-${{ steps.version.outputs.version }}.dmg** below
            2. Open the DMG, drag Battery Time → Applications
            3. Launch — battery icon appears in your menu bar

            **Requires macOS 13 (Ventura) or later.** Liquid glass UI on macOS 26 (Tahoe); material fallback on older versions.
          files: release/BatteryTime-*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
